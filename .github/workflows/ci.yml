name: CogniCare checks

on:
  push:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and generate Prisma client
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply PostgreSQL migrations and seed sample accounts
        run: npm run setup
      - name: Build production app
        run: npm run build
      - name: Verify app and worker against PostgreSQL, PgBouncer, and Valkey
        run: |
          npm run start > /tmp/cognicare-next.log 2>&1 &
          npm run worker > /tmp/cognicare-worker.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/api/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:3000/api/ready
          npm run test:integration
      - name: Show service logs after failures
        if: failure()
        run: |
          docker compose logs --no-color
          cat /tmp/cognicare-next.log /tmp/cognicare-worker.log 2>/dev/null || true
