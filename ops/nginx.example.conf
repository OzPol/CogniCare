# Include inside nginx's http context. Supply your hostname and certificate paths.
limit_req_zone $binary_remote_addr zone=cognicare_public_ip:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=cognicare_private_ip:10m rate=25r/s;
limit_req_status 429;


server {
  listen 443 ssl;
  server_name cognicare.example.org;
  ssl_certificate     /etc/ssl/cognicare/fullchain.pem;
  ssl_certificate_key /etc/ssl/cognicare/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 32k;

  location = /api/catalog {
    limit_req zone=cognicare_public_ip burst=1100 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-CogniCare-Client-IP $remote_addr;
  }

  location / {
    limit_req zone=cognicare_private_ip burst=60 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-CogniCare-Client-IP $remote_addr;
    proxy_hide_header Strict-Transport-Security;
    proxy_buffering off;
  }
}
